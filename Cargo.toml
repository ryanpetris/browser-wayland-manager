[package]
name = "elsewhere-innkeeper"
version = "0.0.0"
edition = "2024"
license = "MIT"
description = "Manage isolated Elsewhere Docker desktops"

[package.metadata.elsewhere]
version = "0.5.1"

[package.metadata.deb]
maintainer = "Elsewhere Innkeeper contributors <noreply@localhost>"
section = "admin"
priority = "optional"
extended-description = """\
Creates and manages isolated Arch Linux and Debian desktops in Docker, with a web
interface for session startup, logs, previews, and persistent home directories."""
license-file = ["LICENSE", "0"]
depends = "$auto, docker.io, docker-cli, curl, ca-certificates, systemd, init-system-helpers"
maintainer-scripts = "packaging/debian"
systemd-units = { unit-scripts = "packaging", enable = false, start = false }
assets = [
    ["target/release/elsewhere-innkeeper", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/elsewhere-innkeeper/", "644"],
    ["packaging/environment", "etc/elsewhere-innkeeper/environment", "644"],
    ["sessions/*", "usr/share/elsewhere-innkeeper/sessions/", "644"],
]

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
http-body = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
subtle = "2"
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"

[build-dependencies]
toml = "1.1.5"
