name: check
on:
  push:
    tags-ignore:
      - '**'
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compose configuration without runtime settings
        run: env -u INNKEEPER_RTC_ADDR docker compose --env-file /dev/null config --quiet
      - run: docker build --target check .
