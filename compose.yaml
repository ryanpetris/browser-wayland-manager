name: browser-wayland-manager
services:
  manager:
    build:
      context: .
      args:
        BWM_VERSION: "${BWM_VERSION:-}"
    ports:
      - "19300:19300"
    environment:
      BWM_PUBLIC_HOST: "${BWM_PUBLIC_HOST:-}"
      BWM_SESSION_BIND: "${BWM_SESSION_BIND:-0.0.0.0}"
      BWM_DOCKER_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri:ro
      - manager-data:/var/lib/browser-wayland-manager
    restart: unless-stopped
volumes:
  manager-data:
