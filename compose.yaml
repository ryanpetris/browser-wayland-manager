name: elsewhere-innkeeper
services:
  innkeeper:
    build:
      context: .
      args:
        INNKEEPER_VERSION: "${INNKEEPER_VERSION:-}"
    ports:
      - "19300:19300"
    environment:
      INNKEEPER_PUBLIC_HOST: "${INNKEEPER_PUBLIC_HOST:-}"
      INNKEEPER_SESSION_BIND: "${INNKEEPER_SESSION_BIND:-0.0.0.0}"
      INNKEEPER_DOCKER_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri:ro
      - innkeeper-data:/var/lib/elsewhere-innkeeper
    restart: unless-stopped
volumes:
  innkeeper-data:
