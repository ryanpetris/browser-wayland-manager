name: elsewhere-innkeeper
services:
  innkeeper:
    build:
      context: .
      args:
        INNKEEPER_VERSION: "${INNKEEPER_VERSION:-}"
    ports:
      - "19300:19300"
    environment:
      INNKEEPER_RTC_ADDR: "${INNKEEPER_RTC_ADDR:?Set the IPv4 address browsers can reach for WebRTC}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/dri:/dev/dri:ro
      - innkeeper-data:/var/lib/elsewhere-innkeeper
    restart: unless-stopped
volumes:
  innkeeper-data:
